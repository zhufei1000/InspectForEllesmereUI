name: Verify CurseForge upload

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check CurseForge token
        shell: bash
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::The CF_API_TOKEN secret is not configured."
            exit 1
          fi
      - name: Build installable ZIP
        run: python tools/package_recommendations.py
      - name: Dry-run CurseForge upload
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^## Version: *v\{0,1\}//p' InspectForEllesmereUI.toc | head -n 1 | tr -d '\r')"
          python tools/upload_curseforge.py \
            --project-id 1735274 \
            --zip 'dist/InspectForEllesmereUI_*.zip' \
            --tag "v$version" \
            --dry-run
      - name: Probe upload endpoint user-agent handling
        run: |
          python - <<'PY'
          import urllib.error
          import urllib.request

          URL = "https://wow.curseforge.com/api/projects/1735274/upload"
          AGENTS = [
              None,
              "InspectForEllesmereUI-release",
              "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
          ]
          for agent in AGENTS:
              headers = {"Accept": "application/json"}
              if agent:
                  headers["User-Agent"] = agent
              request = urllib.request.Request(URL, data=b"", method="POST", headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      code, body = response.status, response.read()[:200]
              except urllib.error.HTTPError as exc:
                  code, body = exc.code, exc.read()[:200]
              text = body.decode("utf-8", errors="replace").replace("\n", " ")[:160]
              print(f"UA={agent!r} code={code} body={text}")
          PY
