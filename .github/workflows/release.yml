name: Release addon

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, such as v2.3.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install -r tests/requirements.txt
      - name: Check version and build installable ZIP
        run: python tools/package_recommendations.py --tag "$RELEASE_TAG"
      - name: Test Lua and recommendation data
        run: python tests/run_recommendation_tests.py --lazy-dir GearData --real-data --aggregate
      - name: Verify package and generate SHA256
        run: |
          python tools/verify_packages.py dist/*.zip
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state.txt 2>/dev/null; then
            if [ "$(cat release-state.txt)" = "false" ]; then
              echo "Release $RELEASE_TAG is already published; preserving its assets."
              exit 0
            fi
            gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt \
              --verify-tag --draft --title "Inspect for EllesmereUI $RELEASE_TAG" --generate-notes
          fi
          gh release edit "$RELEASE_TAG" --draft=false
