name: Check addon

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install -r tests/requirements.txt
      - name: Test Lua and recommendation data
        run: python tests/run_recommendation_tests.py --lazy-dir GearData --real-data --aggregate
      - name: Build and verify installable ZIP
        run: |
          python tools/package_recommendations.py
          python tools/verify_packages.py dist/*.zip
